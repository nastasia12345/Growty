<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="16" fill="#10b981"/>
  <!-- Pot -->
  <path d="M22 46 Q22 50 32 50 Q42 50 42 46 L40 38 H24 Z" fill="#ffffff" opacity="0.9"/>
  <ellipse cx="32" cy="38" rx="8" ry="2.5" fill="#ffffff" opacity="0.7"/>
  <!-- Stem -->
  <rect x="30.5" y="20" width="3" height="20" rx="1.5" fill="#ffffff"/>
  <!-- Left leaf -->
  <ellipse cx="23" cy="32" rx="8" ry="3.5" fill="#ffffff" opacity="0.9"
           transform="rotate(-35 23 32)"/>
  <!-- Right leaf -->
  <ellipse cx="41" cy="32" rx="8" ry="3.5" fill="#ffffff" opacity="0.9"
           transform="rotate(35 41 32)"/>
  <!-- Flower petals -->
  <circle cx="32" cy="16" r="5"   fill="#ffffff" opacity="0.85"/>
  <circle cx="25" cy="19" r="4"   fill="#ffffff" opacity="0.85"/>
  <circle cx="39" cy="19" r="4"   fill="#ffffff" opacity="0.85"/>
  <circle cx="22" cy="25" r="3.5" fill="#ffffff" opacity="0.75"/>
  <circle cx="42" cy="25" r="3.5" fill="#ffffff" opacity="0.75"/>
  <!-- Flower centre -->
  <circle cx="32" cy="21" r="6" fill="#fbbf24"/>
  <circle cx="32" cy="21" r="3" fill="#f59e0b"/>
</svg>
