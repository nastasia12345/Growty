<mat-toolbar color="primary">
  <button mat-icon-button (click)="sidenav.toggle()" *ngIf="isLoggedIn">
    <mat-icon>menu</mat-icon>
  </button>
  <span>🌱 KanbanPlant</span>
  <span class="spacer"></span>
  <!-- Тимчасово без логіна – просто кнопка виходу для очищення -->
  <button mat-button *ngIf="isLoggedIn" (click)="logout()">Вийти</button>
</mat-toolbar>

<mat-sidenav-container *ngIf="isLoggedIn">
  <mat-sidenav #sidenav mode="over">
    <mat-nav-list>
      <a mat-list-item routerLink="/boards" (click)="sidenav.close()">
        <mat-icon>dashboard</mat-icon> Дошки
      </a>
      <a mat-list-item routerLink="/calendar" (click)="sidenav.close()">
        <mat-icon>calendar_today</mat-icon> Календар
      </a>
      <a mat-list-item routerLink="/plant" (click)="sidenav.close()">
        <mat-icon>local_florist</mat-icon> Рослинка
      </a>
      <a mat-list-item routerLink="/analytics" routerLinkActive="active">
        <mat-icon>analytics</mat-icon> Аналітика
      </a>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>

<div *ngIf="!isLoggedIn" style="padding: 2rem; text-align: center;">
  <h2>Ласкаво просимо!</h2>
  <button mat-raised-button color="primary" routerLink="/boards">Увійти як гість</button>
  <p style="margin-top: 1rem;">(Поки що без реєстрації – використовується тимчасовий користувач)</p>
</div>
