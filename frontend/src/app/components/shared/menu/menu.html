<mat-toolbar class="toolbar">
  <button mat-icon-button (click)="sidenav.toggle()" class="menu-toggle">
    <mat-icon>menu</mat-icon>
  </button>

  <a class="brand" routerLink="/">
    🌱 <span class="brand-name">Growty</span>
  </a>

  <!-- Desktop nav links -->
  <nav class="desktop-nav">
    <a routerLink="/" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact:true}">
      <mat-icon>home</mat-icon> Home
    </a>
    <a routerLink="/boards" routerLinkActive="active-link">
      <mat-icon>dashboard</mat-icon> Boards
    </a>
    <a routerLink="/analytics" routerLinkActive="active-link">
      <mat-icon>insights</mat-icon> Analytics
    </a>
    <a routerLink="/plant" routerLinkActive="active-link">
      <mat-icon>local_florist</mat-icon> Plant
    </a>
    <a routerLink="/calendar" routerLinkActive="active-link">
      <mat-icon>calendar_month</mat-icon> Calendar
    </a>
  </nav>

  <span class="spacer"></span>
</mat-toolbar>

<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #sidenav mode="over" class="sidenav">
    <div class="sidenav-brand">
      🌱 <strong style="color:#10b981">Growty</strong>
    </div>
    <mat-nav-list>
      <a mat-list-item routerLink="/" routerLinkActive="active-item"
         [routerLinkActiveOptions]="{exact:true}" (click)="sidenav.close()">
        <mat-icon matListItemIcon>home</mat-icon>
        <span matListItemTitle>Home</span>
      </a>
      <a mat-list-item routerLink="/boards" routerLinkActive="active-item" (click)="sidenav.close()">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Boards</span>
      </a>
      <a mat-list-item routerLink="/analytics" routerLinkActive="active-item" (click)="sidenav.close()">
        <mat-icon matListItemIcon>insights</mat-icon>
        <span matListItemTitle>Analytics</span>
      </a>
      <a mat-list-item routerLink="/plant" routerLinkActive="active-item" (click)="sidenav.close()">
        <mat-icon matListItemIcon>local_florist</mat-icon>
        <span matListItemTitle>Plant</span>
      </a>
      <a mat-list-item routerLink="/calendar" routerLinkActive="active-item" (click)="sidenav.close()">
        <mat-icon matListItemIcon>calendar_month</mat-icon>
        <span matListItemTitle>Calendar</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
