<div class="boards-container">
  <div class="header">
    <h2>Мої дошки</h2>
    <button mat-raised-button color="primary" (click)="createBoard()">
      <mat-icon>add</mat-icon> Нова дошка
    </button>
  </div>

  <div class="boards-grid">
    <mat-card *ngFor="let board of boards"
              class="board-card"
              [routerLink]="['/board', board.id]">
      <mat-card-header>
        <mat-card-title>{{ board.title }}</mat-card-title>
        <mat-card-subtitle>
          Створено: {{ board.createdAt | date }}
        </mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        <p>{{ board.description || 'Без опису' }}</p>
      </mat-card-content>

      <mat-card-actions align="end">
        <button mat-icon-button (click)="editBoard(board); $event.stopPropagation()">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button (click)="deleteBoard(board.id); $event.stopPropagation()">
          <mat-icon>delete</mat-icon>
        </button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
