<!-- Backdrop -->
<div class="backdrop" (click)="close()"></div>

<!-- Panel -->
<div class="auth-panel">

  <!-- Close -->
  <button class="close-btn" (click)="close()">
    <mat-icon>close</mat-icon>
  </button>

  <!-- Logo -->
  <div class="auth-brand">🌱 <span>Growty</span></div>

  <!-- Tabs (hidden on reset view) -->
  <div class="auth-tabs" *ngIf="tab !== 'reset'">
    <button [class.active]="tab === 'login'"    (click)="switchTab('login')">{{ 'auth.signIn' | translate }}</button>
    <button [class.active]="tab === 'register'" (click)="switchTab('register')">{{ 'auth.createAccount' | translate }}</button>
  </div>

  <!-- Reset password heading -->
  <div class="reset-heading" *ngIf="tab === 'reset'">
    <button class="back-btn" type="button" (click)="switchTab('login')">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <div>
      <h2>{{ 'auth.resetTitle' | translate }}</h2>
      <p>{{ 'auth.resetSubtitle' | translate }}</p>
    </div>
  </div>

  <!-- Success -->
  <div class="auth-success" *ngIf="success">
    <mat-icon>check_circle</mat-icon> {{ success }}
  </div>

  <!-- Error -->
  <div class="auth-error" *ngIf="error">
    <mat-icon>error_outline</mat-icon> {{ error }}
  </div>

  <!-- ── LOGIN FORM ── -->
  <form *ngIf="tab === 'login'" (ngSubmit)="submitLogin()" class="auth-form" autocomplete="on">
    <div class="field">
      <label>{{ 'auth.emailLabel' | translate }}</label>
      <div class="input-wrap">
        <mat-icon>email</mat-icon>
        <input type="email" [(ngModel)]="loginEmail" name="email"
               [placeholder]="'auth.emailPlaceholder' | translate" autocomplete="email" required/>
      </div>
    </div>

    <div class="field">
      <label>{{ 'auth.passwordLabel' | translate }}</label>
      <div class="input-wrap">
        <mat-icon>lock</mat-icon>
        <input [type]="showLoginPwd ? 'text' : 'password'"
               [(ngModel)]="loginPassword" name="password"
               [placeholder]="'auth.passwordHint' | translate" autocomplete="current-password" required/>
        <button type="button" class="eye-btn" (click)="showLoginPwd = !showLoginPwd" tabindex="-1">
          <mat-icon>{{ showLoginPwd ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </div>
    </div>

    <button type="submit" class="submit-btn" [disabled]="loading">
      <mat-icon *ngIf="loading" class="spin">autorenew</mat-icon>
      <mat-icon *ngIf="!loading">login</mat-icon>
      {{ loading ? ('auth.signingIn' | translate) : ('auth.signIn' | translate) }}
    </button>

    <p class="switch-hint">
      {{ 'auth.noAccount' | translate }}
      <button type="button" class="link-btn" (click)="switchTab('register')">{{ 'auth.createOne' | translate }}</button>
    </p>

    <p class="forgot-link">
      <button type="button" class="link-btn" (click)="switchTab('reset')">
        {{ 'auth.forgotPassword' | translate }}
      </button>
    </p>
  </form>

  <!-- ── RESET PASSWORD FORM ── -->
  <form *ngIf="tab === 'reset'" (ngSubmit)="submitReset()" class="auth-form" autocomplete="off">

    <div class="field">
      <label>{{ 'auth.emailLabel' | translate }}</label>
      <div class="input-wrap">
        <mat-icon>email</mat-icon>
        <input type="email" [(ngModel)]="resetEmail" name="resetEmail"
               [placeholder]="'auth.emailPlaceholder' | translate" autocomplete="email" required/>
      </div>
    </div>

    <div class="field">
      <label>{{ 'auth.newPasswordLabel' | translate }}</label>
      <div class="input-wrap">
        <mat-icon>lock_reset</mat-icon>
        <input [type]="showResetPwd ? 'text' : 'password'"
               [(ngModel)]="resetPassword" name="newPassword"
               placeholder="••••••••" autocomplete="new-password" required/>
        <button type="button" class="eye-btn" (click)="showResetPwd = !showResetPwd" tabindex="-1">
          <mat-icon>{{ showResetPwd ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </div>
    </div>

    <div class="field">
      <label>{{ 'auth.confirmNewPasswordLabel' | translate }}</label>
      <div class="input-wrap">
        <mat-icon>lock_outline</mat-icon>
        <input [type]="showResetConf ? 'text' : 'password'"
               [(ngModel)]="resetConfirm" name="confirmPassword"
               placeholder="••••••••" autocomplete="new-password" required/>
        <button type="button" class="eye-btn" (click)="showResetConf = !showResetConf" tabindex="-1">
          <mat-icon>{{ showResetConf ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </div>
    </div>

    <button type="submit" class="submit-btn reset-submit" [disabled]="loading">
      <mat-icon *ngIf="loading" class="spin">autorenew</mat-icon>
      <mat-icon *ngIf="!loading">lock_reset</mat-icon>
      {{ loading ? ('auth.resetting' | translate) : ('auth.resetSubmit' | translate) }}
    </button>

  </form>

  <!-- ── REGISTER FORM ── -->
  <form *ngIf="tab === 'register'" (ngSubmit)="submitRegister()" class="auth-form" autocomplete="on">
    <div class="field">
      <label>{{ 'auth.displayNameLabel' | translate }}</label>
      <div class="input-wrap">
        <mat-icon>person</mat-icon>
        <input type="text" [(ngModel)]="regName" name="displayName"
               [placeholder]="'auth.displayNamePlaceholder' | translate" autocomplete="name" required/>
      </div>
    </div>

    <div class="field">
      <label>{{ 'auth.emailLabel' | translate }}</label>
      <div class="input-wrap">
        <mat-icon>email</mat-icon>
        <input type="email" [(ngModel)]="regEmail" name="email"
               [placeholder]="'auth.emailPlaceholder' | translate" autocomplete="email" required/>
      </div>
    </div>

    <div class="field">
      <label>{{ 'auth.passwordLabel' | translate }} <span class="hint">({{ 'auth.passwordHint' | translate }})</span></label>
      <div class="input-wrap">
        <mat-icon>lock</mat-icon>
        <input [type]="showRegPwd ? 'text' : 'password'"
               [(ngModel)]="regPassword" name="password"
               placeholder="••••••••" autocomplete="new-password" required/>
        <button type="button" class="eye-btn" (click)="showRegPwd = !showRegPwd" tabindex="-1">
          <mat-icon>{{ showRegPwd ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </div>
    </div>

    <div class="field">
      <label>{{ 'auth.confirmPasswordLabel' | translate }}</label>
      <div class="input-wrap">
        <mat-icon>lock_outline</mat-icon>
        <input [type]="showRegConfirm ? 'text' : 'password'"
               [(ngModel)]="regConfirm" name="confirm"
               placeholder="••••••••" autocomplete="new-password" required/>
        <button type="button" class="eye-btn" (click)="showRegConfirm = !showRegConfirm" tabindex="-1">
          <mat-icon>{{ showRegConfirm ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </div>
    </div>

    <button type="submit" class="submit-btn" [disabled]="loading">
      <mat-icon *ngIf="loading" class="spin">autorenew</mat-icon>
      <mat-icon *ngIf="!loading">person_add</mat-icon>
      {{ loading ? ('auth.creatingAccount' | translate) : ('auth.createAccount' | translate) }}
    </button>

    <p class="switch-hint">
      {{ 'auth.hasAccount' | translate }}
      <button type="button" class="link-btn" (click)="switchTab('login')">{{ 'auth.signIn' | translate }}</button>
    </p>
  </form>

</div>
